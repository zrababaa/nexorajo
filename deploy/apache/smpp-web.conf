# Nexora SMS Portal (SMPP.Web) - Apache reverse proxy in front of Kestrel
#
# Required modules:
#   a2enmod proxy proxy_http headers rewrite
#   (a2enmod ssl socache_shmcb  -- only if using the HTTPS vhost below)
#
# Kestrel is bound to 127.0.0.1:5083 by ASPNETCORE_URLS in smpp-web.service.
# Adjust ServerName below to your real domain.

<VirtualHost *:80>
    ServerName smpp.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:5083/
    ProxyPassReverse / http://127.0.0.1:5083/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/smpp-web-error.log
    CustomLog ${APACHE_LOG_DIR}/smpp-web-access.log combined
</VirtualHost>

# --- HTTPS (recommended) ---
# Once you have a certificate (e.g. via certbot --apache), use this instead of
# the plain :80 vhost above, or let certbot generate it for you and just add
# the ProxyPass/ProxyPassReverse/RequestHeader lines into the resulting file.
#
# <VirtualHost *:443>
#     ServerName smpp.example.com
#
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/smpp.example.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/smpp.example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#
#     ProxyPass / http://127.0.0.1:5083/
#     ProxyPassReverse / http://127.0.0.1:5083/
#
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port "443"
#
#     ErrorLog ${APACHE_LOG_DIR}/smpp-web-ssl-error.log
#     CustomLog ${APACHE_LOG_DIR}/smpp-web-ssl-access.log combined
# </VirtualHost>
